<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT ZERO: Blackout Protocol</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0e1522;color:#eef7ff;font:14px/1.55 system-ui,'Malgun Gothic',sans-serif}canvas{display:block}#ui{position:fixed;top:12px;left:12px;width:min(410px,calc(100vw - 24px));max-height:75vh;overflow:auto;background:#101827e8;border:1px solid #4c6481;border-radius:14px;padding:14px;box-shadow:0 10px 24px #0006}h2{margin:0 0 6px;font-size:19px}#chapter{color:#88d8ff;font-size:13px;margin-bottom:6px;font-weight:700}#story{font-size:13px;color:#becce1;white-space:pre-wrap}#info{padding:8px 0;font-weight:650;white-space:pre-wrap}#clue{padding:10px;margin:6px 0;border-left:3px solid #45cbaf;background:#1c2b3c;white-space:pre-wrap}#notice{color:#8ff1c7;font-weight:650;min-height:20px;margin-top:5px}button{font:inherit;cursor:pointer;color:#fff;background:#3b62d7;border:0;border-radius:8px;padding:10px 13px}input{font:inherit;background:#17253d;color:#fff;border:1px solid #7d96b8;border-radius:7px;padding:9px;width:130px}#codePanel[hidden]{display:none}#codePanel{margin-top:10px}#controls{position:fixed;bottom:12px;left:12px;padding:9px 13px;border-radius:9px;background:#101827d9;max-width:calc(100vw - 130px);font-size:12px}#interact{position:fixed;bottom:14px;right:15px;padding:13px 19px;font-size:16px}#timer{color:#ffdf9c;font-size:12px}#status{font-size:12px;color:#9cc3ec}

/* Mobile-only controls and collapsible HUD */
#hudToggle{display:none;background:#254970;padding:6px 10px;white-space:nowrap;font-size:12px}
#mobileControls{display:none}
body.touch-ui{touch-action:none;-webkit-user-select:none;user-select:none}
body.touch-ui input{user-select:text;-webkit-user-select:text}
body.touch-ui #ui{top:8px;left:8px;width:min(330px,calc(100vw - 16px));max-height:min(70dvh,520px);padding:10px 12px;font-size:12px;overflow-y:auto;overscroll-behavior:contain}
body.touch-ui #ui h2{font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px}
body.touch-ui #ui h2 small{font-size:9px!important}
body.touch-ui #hudToggle{display:block}
body.touch-ui #ui.collapsed #story,body.touch-ui #ui.collapsed #clue,body.touch-ui #ui.collapsed #timer,body.touch-ui #ui.collapsed #status{display:none!important}
body.touch-ui #ui.collapsed #chapter{margin:0;font-size:11px}
body.touch-ui #ui.collapsed #info{font-size:11px;padding:2px 0;max-height:3.2em;overflow:hidden}
body.touch-ui #ui.collapsed #notice{font-size:11px;min-height:0;margin:0}
body.touch-ui #ui.collapsed #codePanel:not([hidden]){display:flex;gap:5px;align-items:center}
body.touch-ui #ui.collapsed #codePanel input{max-width:150px}
body.touch-ui #controls,body.touch-ui #interact{display:none}
body.touch-ui #mobileControls{display:block}
#joystickArea{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(22px,calc(env(safe-area-inset-bottom) + 15px));width:148px;height:148px;touch-action:none;z-index:15}
#joystickBase{position:absolute;left:14px;top:14px;width:120px;height:120px;border-radius:50%;border:2px solid #b3d9f5a0;background:#243d5685;box-shadow:inset 0 0 22px #0008;display:grid;place-items:center;color:#d6eafe;font-size:11px}
#joystickThumb{position:absolute;left:45px;top:45px;width:58px;height:58px;border-radius:50%;background:#9ed8f0cc;border:2px solid #e8faff;box-shadow:0 3px 12px #0008;pointer-events:none;transform:translate(0px,0px)}
#mobileActions{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(29px,calc(env(safe-area-inset-bottom) + 20px));display:flex;flex-direction:column;align-items:flex-end;gap:18px;z-index:15}
#mobileActions button{border:2px solid #e5f7ff9e;border-radius:50%;box-shadow:0 3px 14px #0009;touch-action:none;-webkit-tap-highlight-color:transparent;font-weight:750}
#mobileJump{width:76px;height:76px;background:#366ac9db}
#mobileInteract{width:88px;height:88px;background:#119b81e8}
@media(max-height:440px){body.touch-ui #ui{max-height:57dvh}#joystickArea{transform:scale(.8);transform-origin:bottom left}#mobileActions{transform:scale(.8);transform-origin:bottom right;gap:7px}}

/* ESC pause panel for PC, plus tap-friendly mobile pause access */
#pauseOverlay[hidden],#mouseTip[hidden]{display:none!important}
#pauseOverlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#050b16ce;backdrop-filter:blur(8px);padding:18px}
#pauseCard{width:min(400px,100%);background:#14243a;border:1px solid #62809f;border-radius:20px;padding:28px;box-shadow:0 16px 45px #000a;text-align:center}
#pauseCard h2{font-size:27px;margin-bottom:8px}#pauseCard p{color:#bed0e5}
#pauseCard button{display:block;width:100%;margin-top:12px;font-size:16px;padding:13px}
#resumeBtn{background:#197a70}#emergencyExit{background:#a13f50}#emergencyExit[hidden]{display:none}
#mouseTip{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#0c2134ed;border:1px solid #4d7699;padding:8px 15px;border-radius:12px;pointer-events:none;z-index:20;text-align:center}
#pauseMobile{display:none;position:fixed;right:12px;top:12px;z-index:22;background:#263f66;padding:7px 12px}
body.touch-ui #pauseMobile{display:block}
body.paused #mobileControls{display:none}body.paused #interact{display:none}
</style></head><body><section id="ui"><h2><span>PROJECT ZERO <small style="font-size:11px;color:#8ca6c5">BLACKOUT PROTOCOL</small></span><button id="hudToggle" type="button" aria-expanded="false">자세히 보기</button></h2><div id="chapter"></div><div id="story"></div><div id="info">서버 연결 중...</div><div id="clue"></div><div id="timer"></div><div id="status"></div><div id="notice"></div><div id="codePanel" hidden><input id="code" maxlength="3" inputmode="numeric" placeholder="보안 코드 3자리"><button id="submit">인증</button></div></section><div id="controls">WASD 이동 · 마우스 화면 회전 · Space 점프 · E 자기 콘솔 조작 · ESC 일시정지<br>팀원과 단서를 말로 공유하세요 · 6개 협동 퍼즐 완료 후 초록 발판으로 탈출</div><button id="interact">E 상호작용</button><button id="pauseMobile" type="button">Ⅱ 일시정지</button><div id="mouseTip" hidden>화면을 클릭하면 마우스 시점 조작 시작 · ESC 일시정지</div><div id="pauseOverlay" hidden role="dialog" aria-modal="true" aria-label="일시정지"><div id="pauseCard"><h2>일시정지</h2><p>마우스를 사용할 수 있어요.<br>다시하기를 누르면 게임 시점으로 돌아갑니다.</p><button id="resumeBtn" type="button">▶ 다시하기</button><button id="emergencyExit" type="button" hidden>긴급 나가기 · 대기실</button></div></div><div id="mobileControls" aria-label="모바일 게임 조작"><div id="joystickArea"><div id="joystickBase">이동</div><div id="joystickThumb"></div></div><div id="mobileActions"><button id="mobileJump" type="button">점프</button><button id="mobileInteract" type="button">조작 E</button></div></div><script src="/socket.io/socket.io.js"></script><script type="module" src="/main.js"></script></body></html>
